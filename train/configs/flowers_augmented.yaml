model: models/yolov8s-worldv2.pt
data: train/datasets/flowers_video_holdout/data.yaml
partition_policy: same_setup_video_holdout
project: train/runs
name: flowers_lora_augmented
prompts:
- potted peony
- potted orchid
- potted sunflower
- potted eucalyptus
display_names:
- 芍药
- 兰花
- 向日葵
- 桉树叶
lora:
  rank: 8
  alpha: 16.0
  dropout: 0.0
  target_patterns:
  - attn.gl
  - attn.proj_conv.conv
  - model.22.cv3
  train_bias: none
  freeze_clip: true
  freeze_batchnorm: true
training:
  epochs: 60
  imgsz: 640
  batch: 8
  device: '0'
  workers: 4
  optimizer: AdamW
  lr0: 0.0001
  patience: 15
  seed: 42
  amp: false
  rect: false
  save: true
  exist_ok: false
  hsv_h: 0.01
  hsv_s: 0.2
  hsv_v: 0.3
  degrees: 10.0
  translate: 0.1
  scale: 0.3
  fliplr: 0.5
  flipud: 0.0
  mosaic: 0.2
  mixup: 0.0
  copy_paste: 0.0
  erasing: 0.0
  close_mosaic: 10
camera_augmentation: true
